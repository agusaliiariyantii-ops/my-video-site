<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Video & Download</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio aspek 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background: #000;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Styling Tombol Download / Smartlink */
        .btn-download {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            transition: background 0.3s;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Streaming Video</h1>
        
        <!-- Kotak Video -->
        <div class="video-container">
            <iframe src="https://www.xvideos.com/embedframe/ihfihdb996e" scrolling="no" allowfullscreen="allowfullscreen"></iframe>
        </div>

        <!-- Tombol Download / Smartlink Anda -->
        <div>
            <a href="URL_SMARTLINK_ANDA_DISINI" class="btn-download" target="_blank">📥 Download Video / Full HD</a>
        </div>

        <!-- Area Kotak Penempatan Iklan Native Banner / Banner -->
        <div class="ad-container">
            <!-- TEMPELKAN KODE NATIVE BANNER / SCRIPT IKLAN ANDA DI SINI -->
        </div>
    </div>

</body>
</html>
